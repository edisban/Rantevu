# Settings come from .env (see .env.example); the defaults below are for local development only
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rantevu}
      POSTGRES_USER: ${POSTGRES_USER:-rantevu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rantevu}
    # No published port: only the backend reaches the database, over the internal Docker network.
    # For a SQL shell: docker exec -it rantevu-db-1 psql -U rantevu -d rantevu
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rantevu}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rantevu}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rantevu}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}  # true once served over HTTPS
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:8082:8080"  # direct API access for local tools only; the site goes through nginx
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
