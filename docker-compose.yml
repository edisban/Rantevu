services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rantevu
      POSTGRES_USER: rantevu
      POSTGRES_PASSWORD: rantevu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rantevu
      SPRING_DATASOURCE_USERNAME: rantevu
      SPRING_DATASOURCE_PASSWORD: rantevu
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
