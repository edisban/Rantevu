spring.datasource.url=jdbc:postgresql://localhost:5432/rantevu
spring.datasource.username=rantevu
spring.datasource.password=rantevu
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.port=8080
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
jwt.expiration=86400000
# Redis holds the login rate-limit counters (Docker Compose sets the host to the redis service)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
# Auth cookie: set COOKIE_SECURE=true when served over HTTPS (production)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
# Only needed when the frontend runs on a different origin (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Trust X-Forwarded-* from the proxy, so the real client IP and https scheme are seen
server.forward-headers-strategy=framework
# Load everything a response needs inside the service transaction, never lazily while writing JSON
spring.jpa.open-in-view=false
# Users come from our own database and JWT, so Spring Boot's generated default user isn't needed
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
